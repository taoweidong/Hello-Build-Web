[project]
name = "app"
version = "0.1.0"
description = "构建策略配置系统后端（基于 full-stack-fastapi-template 架构）"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "tenacity<10.0.0,>=8.2.3",
    "pydantic>2.0",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "sqlmodel>=0.0.39,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "pyjwt<3.0.0,>=2.13.0",
    "pwdlib[bcrypt]>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.fastapi]
entrypoint = "app.main:app"
